{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demo offline | MindForm</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A0E2E'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23F0386B'/%3E%3C/svg%3E" />
<script>
  /* Same theme as the rest of the site (and the cockpit), set before first paint. */
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t !== 'dark' && t !== 'light') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'mindform/css/console.css' %}" />
</head>
<body>
<section class="start">
  <header class="head">
    <a class="brand" href="{% url 'landing' %}"><span class="brand-dot"></span>MindForm<span class="brand-chip">Console</span></a>
    <div class="head-actions">
      <a class="ghost-btn" href="{% url 'landing' %}">← Back to site</a>
    </div>
  </header>
  <div class="start-scroll offline-page">
    {% include "core/partials/demo_offline_card.html" %}
  </div>
</section>
</body>
</html>
